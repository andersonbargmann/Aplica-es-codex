{% extends 'base.html' %}
{% block title %}{{ 'Editar' if user else 'Novo' }} Usuário{% endblock %}
{% block content %}
<h2>{{ 'Editar' if user else 'Novo' }} Usuário</h2>
<form method="post" class="card card-body">
  <div class="row g-2">
    <div class="col-md-6"><label class="form-label">Nome</label><input class="form-control" name="name" value="{{ user.name if user else '' }}" required></div>
    <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" name="email" value="{{ user.email if user else '' }}" required></div>
    <div class="col-md-6"><label class="form-label">Senha {% if user %}(opcional){% endif %}</label><input type="password" class="form-control" name="password" {% if not user %}required{% endif %}></div>
    <div class="col-md-3"><label class="form-label">Role</label><select class="form-select" name="role">{% for r in roles %}<option value="{{ r }}" {% if user and user.role==r %}selected{% endif %}>{{ r }}</option>{% endfor %}</select></div>
    <div class="col-md-3"><label class="form-label">Setor</label><select class="form-select" name="department_id">{% for d in departments %}<option value="{{ d.id }}" {% if user and user.department_id==d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></div>
  </div>
  <div class="form-check mt-3"><input class="form-check-input" type="checkbox" name="is_active" id="active" {% if not user or user.is_active %}checked{% endif %}><label class="form-check-label" for="active">Ativo</label></div>
  <button class="btn btn-success mt-3">Salvar</button>
</form>
{% endblock %}
