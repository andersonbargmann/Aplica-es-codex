{% extends 'base.html' %}
{% block title %}Novo Chamado{% endblock %}
{% block content %}
<h2 class="mb-3">Abrir chamado</h2>
<form method="post" enctype="multipart/form-data" class="card card-body shadow-sm">
  <div class="row g-3">
    <div class="col-md-4">
      <label class="form-label">Categoria</label>
      <select class="form-select" name="category" required>
        {% for item in categories %}<option>{{ item }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Prioridade</label>
      <select class="form-select" name="priority" required>
        {% for item in priorities %}<option>{{ item }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-12">
      <label class="form-label">Assunto</label>
      <input class="form-control" name="subject" required>
    </div>
    <div class="col-md-12">
      <label class="form-label">Descrição detalhada</label>
      <textarea class="form-control" rows="6" name="description" required></textarea>
    </div>
    <div class="col-md-6">
      <label class="form-label">Anexo (imagem/pdf)</label>
      <input type="file" class="form-control" name="attachment" accept=".png,.jpg,.jpeg,.pdf">
    </div>
  </div>
  <div class="mt-3">
    <button class="btn btn-primary">Abrir chamado</button>
  </div>
</form>
{% endblock %}
