{% extends 'base.html' %}
{% block title %}{{ 'Editar' if user else 'Novo' }} Usuário{% endblock %}
{% block content %}
<h2 class="mb-3">{{ 'Editar usuário' if user else 'Cadastrar usuário' }}</h2>
<form method="post" class="card card-body shadow-sm">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Nome completo</label>
      <input class="form-control" name="name" required value="{{ user.name if user else '' }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="email" required value="{{ user.email if user else '' }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Setor / departamento</label>
      <input class="form-control" name="department" required value="{{ user.department if user else '' }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Perfil</label>
      <select class="form-select" name="role" required>
        <option value="USER" {% if user and user.role == 'USER' %}selected{% endif %}>USER</option>
        <option value="ADMIN" {% if user and user.role == 'ADMIN' %}selected{% endif %}>ADMIN</option>
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Senha {% if user %}(deixe em branco para manter){% endif %}</label>
      <input type="password" class="form-control" name="password" {% if not user %}required{% endif %}>
    </div>
  </div>
  <div class="mt-3">
    <button class="btn btn-success">Salvar</button>
    <a href="{{ url_for('users_list') }}" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
